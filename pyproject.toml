[project]
name = "ulauncher-mistral"
version = "0.1.0"
description = "Ulauncher (v6 / API v3) extension to query Mistral AI"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mistral", "ui"]
